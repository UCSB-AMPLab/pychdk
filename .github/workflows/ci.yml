# The suite is all mocks: it runs the PTP and CHDK protocol logic without a
# camera, which is the only way this library can be tested between bench
# sessions. `tests/` is named explicitly because `examples/` holds hardware
# scripts that pytest would otherwise collect and fail to import.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest tests/ -q
