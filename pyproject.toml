[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pychdk"
version = "0.1.0"
description = "Pure Python CHDK PTP camera control"
requires-python = ">=3.11"
dependencies = [
    "pyusb>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
